name: Deploy AirTrack Pro to GitHub Pages & Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  map-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependencies
        run: |
          pnpm install --no-frozen-lockfile
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run required local map regression
        shell: bash
        env:
          AIRTRACK_TEST_URL: http://127.0.0.1:5187/
        run: |
          export AIRTRACK_EVIDENCE_DIR="$RUNNER_TEMP/map-regression"
          mkdir -p "$AIRTRACK_EVIDENCE_DIR"
          export UNI_OUTPUT_DIR="$RUNNER_TEMP/map-regression-dev/h5"
          pnpm dev:h5 --host 127.0.0.1 --port 5187 --strictPort > "$AIRTRACK_EVIDENCE_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent "$AIRTRACK_TEST_URL" > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$AIRTRACK_EVIDENCE_DIR/server.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent "$AIRTRACK_TEST_URL" > /dev/null
          pnpm test

      - name: Retain map regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-regression-evidence
          path: ${{ runner.temp }}/map-regression
          if-no-files-found: warn

  build-and-deploy-web:
    needs: map-regression
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build H5 for production
        run: pnpm run build:h5

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/build/h5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    needs: map-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web & Sync Android
        run: |
          pnpm run build:h5
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/airtrack-pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airtrack-pro-apk
          path: android/app/build/outputs/apk/debug/airtrack-pro.apk
          if-no-files-found: error

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: AirTrack Pro v1.0.5 (Android APK)
          body: |
            ## AirTrack Pro v1.0.5 发布说明

            ### 🌟 核心新特性与优化
            1. **时间轴游标触控优先权与丝滑跟手**：重构触控热区与碰撞判定体系，消除误判，支持单指 1:1 绝对坐标像素级跟手拖拽与区间快速跳转。
            2. **高频触控节流与真机卡顿治理**：引入 45ms 微信原生 Marker 动态节流与 touchend 即时刷新机制，彻底告别频繁 setData 引发的真机发热与丢帧。
            3. **3D 姿态与空间动力学动态熔断**：移动端抽屉收起（Peek）态自动暂停 3D 动力学姿态高频计算与传输，展开时精准即时补偿计算，兼顾续航与高保真。
            4. **移动端底部抽屉与原生 Canvas 避让**：抽屉向上展开时自动对底层原生 Canvas 实施客户端层级熔断与隐匿，根除原生组件击穿弹层恶性缺陷，折叠时无感自愈。
            5. **时空时间窗口与静止态能量带**：默认 7 天减负提速，深空冰蓝微光能量带与纯白发光脊线，全面提升移动端与桌面端交互质感。
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/airtrack-pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

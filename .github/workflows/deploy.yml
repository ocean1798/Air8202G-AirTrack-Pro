name: Deploy AirTrack Pro to GitHub Pages & Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  map-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependencies
        run: |
          pnpm install --no-frozen-lockfile
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run required local map regression
        shell: bash
        env:
          AIRTRACK_TEST_URL: http://127.0.0.1:5187/
        run: |
          export AIRTRACK_EVIDENCE_DIR="$RUNNER_TEMP/map-regression"
          mkdir -p "$AIRTRACK_EVIDENCE_DIR"
          export UNI_OUTPUT_DIR="$RUNNER_TEMP/map-regression-dev/h5"
          pnpm dev:h5 --host 127.0.0.1 --port 5187 --strictPort > "$AIRTRACK_EVIDENCE_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent "$AIRTRACK_TEST_URL" > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$AIRTRACK_EVIDENCE_DIR/server.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent "$AIRTRACK_TEST_URL" > /dev/null
          pnpm test

      - name: Retain map regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-regression-evidence
          path: ${{ runner.temp }}/map-regression
          if-no-files-found: warn

  build-and-deploy-web:
    needs: map-regression
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build H5 for production
        run: pnpm run build:h5

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/build/h5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    needs: map-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web & Sync Android
        run: |
          pnpm run build:h5
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/airtrack-pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airtrack-pro-apk
          path: android/app/build/outputs/apk/debug/airtrack-pro.apk
          if-no-files-found: error

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: AirTrack Pro v1.0.4 (Android APK)
          body: |
            ## AirTrack Pro v1.0.4 发布说明

            ### 🌟 核心新特性与优化
            1. **3D 姿态与动力学全景联动**：内置 3D 姿态正方体渲染，Roll / Pitch / Heading 动态欧拉角与三轴加速度波形与时空轨迹实时 60FPS 联动。
            2. **时间轴静止态与微光地平线**：彻底消除占位文字与黑板遮挡，升级深空冰蓝微光能量带与纯白发光脊线。
            3. **时空时间窗口优化**：默认时空窗口 7 天减负提速，提升日分辨率 12.8 倍，完美兼容 90 天完整回放。
            4. **移动端/微信小程序全功能对齐**：微信端多指触控手势闭环（单指平移/探针拖拽/双指缩放）、离线轨迹本地持久化、无缝故障轮换。
            5. **白板态真实文案与状态收敛**：根除未登录虚假主账号伪装，直观展示“接入账号”，状态灯动态分流，未选设备遥测真实留空。
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/airtrack-pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
